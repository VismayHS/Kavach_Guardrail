{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kavach.fullname" . }}
  labels: {{- include "kavach.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "kavach.selector" . | nindent 6 }}
  endpoints:
    - {port: http, path: /metrics, interval: {{ .Values.serviceMonitor.interval }}}
{{- end }}
