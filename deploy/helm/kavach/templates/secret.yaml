{{- if not .Values.secrets.existingSecret }}
{{- if eq .Values.profile "prod" }}
{{- $_ := required "secrets.authSecret is required in the prod profile (32+ characters)" .Values.secrets.authSecret }}
{{- $_ := required "secrets.receiptKey is required in the prod profile (32+ characters)" .Values.secrets.receiptKey }}
{{- $_ := required "secrets.signingKeyPem is required in the prod profile (--set-file secrets.signingKeyPem=...)" .Values.secrets.signingKeyPem }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kavach.fullname" . }}
  labels: {{- include "kavach.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth-secret: {{ .Values.secrets.authSecret | quote }}
  receipt-key: {{ .Values.secrets.receiptKey | quote }}
  signing.pem: {{ .Values.secrets.signingKeyPem | quote }}
  inference-api-key: {{ .Values.secrets.inferenceApiKey | quote }}
  inference-endpoint: {{ .Values.secrets.inferenceEndpoint | quote }}
{{- end }}
