{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kavach.fullname" . }}
  labels: {{- include "kavach.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kavach.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8000}]
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    {{- range .Values.networkPolicy.egressCIDRs }}
    - to: [{ipBlock: {cidr: {{ . }}}}]
    {{- end }}
{{- end }}
