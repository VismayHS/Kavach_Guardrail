# Prometheus scrapes KAVACH's /metrics: decisions, rule hits, latency, effects and their outcomes, approvals, holds,
# the sweeper's heartbeat, chain health, dependencies, and model usage and cost.
# Two targets: KAVACH in this compose stack (kavach:8000) and KAVACH on the host (scripts/demo_up.sh, the live demo),
# reached as host.docker.internal. Whichever runs answers; the other shows as down, which is expected.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kavach
    metrics_path: /metrics
    static_configs:
      - targets: ["kavach:8000"]
        labels: {where: compose}
      - targets: ["host.docker.internal:8000"]
        labels: {where: host}

  # Agents' own model usage and cost, pushed over OTLP to the collector: Claude Code's telemetry
  # (claude_code_cost_usage*, claude_code_token_usage*) and scripts/llama_agent.py (kavach_agent_*).
  - job_name: agents
    static_configs:
      - targets: ["otel-collector:8889"]
