# Prometheus scrapes KAVACH's /metrics (decisions by verdict, rule hits, check latency, approvals, holds, kills).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kavach
    metrics_path: /metrics
    static_configs:
      - targets: ["kavach:8000"]
